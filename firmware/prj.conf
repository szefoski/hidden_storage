# SPI + SD-over-SPI block device, raw sector access only (no filesystem mounted).
# CONFIG_DISK_ACCESS selects CONFIG_DISK_DRIVERS and pulls in the
# disk_access_read/write/ioctl API used by src/sd_block.c. CONFIG_SDMMC_STACK
# selects CONFIG_SDHC; CONFIG_DISK_DRIVER_SDMMC and CONFIG_SPI_SDHC then
# default to y on their own once the devicetree overlay's zephyr,sdmmc-disk /
# zephyr,sdhc-spi-slot nodes are present.
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STACK=y

# RTT is the only host link. Buffer 0 stays the normal Zephyr log/console channel;
# buffer 1 (opened by firmware/src/rtt_proto.c) carries the binary command protocol.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y

# No USB device stack anywhere in this build -- this is what keeps the SD card
# from ever being enumerated as a mass-storage device by the host OS.
# (CONFIG_USB_DEVICE_STACK is left unset / default n.)

CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=4096

# Optional per-sector payload encryption (firmware/src/crypto.c), done on the
# nRF54L15's CRACEN hardware engine through the PSA Crypto API. CRACEN is
# auto-selected as the PSA driver for this SoC. AES-256-CTR for the bulk
# cipher, PBKDF2-HMAC-SHA256 to turn the passphrase into a key on-device. No
# RNG is needed: the salt is fixed and the CTR IVs are derived from the sector
# number, so key and IVs are deterministic.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CTR=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# INF is the normal setting. DBG here logs every SD command and is only
# useful when diagnosing card identification (it is what exposed the corrupt
# CSD during bring-up); it is high volume and costs time on every transfer,
# so it stays off unless something is actually being debugged.
CONFIG_SD_LOG_LEVEL_INF=y
CONFIG_SDHC_LOG_LEVEL_INF=y

# Modest headroom over the 1024-byte default so the boot/init sequence is
# never truncated. It was 8192 while DBG-level SD logging was enabled; at INF
# that much is unnecessary.
#
# Note: CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE was set here previously and is NOT
# a real Kconfig symbol -- it never appeared in the generated .config and had
# no effect. The RTT log channel is sized by CONFIG_SEGGER_RTT_BUFFER_SIZE_UP
# (default 1024), which is plenty for INF-level output.
CONFIG_LOG_BUFFER_SIZE=2048
