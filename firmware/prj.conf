# SPI + SD-over-SPI block device, raw sector access only (no filesystem mounted).
# CONFIG_DISK_ACCESS selects CONFIG_DISK_DRIVERS and pulls in the
# disk_access_read/write/ioctl API used by src/sd_block.c. CONFIG_SDMMC_STACK
# selects CONFIG_SDHC; CONFIG_DISK_DRIVER_SDMMC and CONFIG_SPI_SDHC then
# default to y on their own once the devicetree overlay's zephyr,sdmmc-disk /
# zephyr,sdhc-spi-slot nodes are present.
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STACK=y

# RTT is the only host link. Buffer 0 stays the normal Zephyr log/console channel;
# buffer 1 (opened by firmware/src/rtt_proto.c) carries the binary command protocol.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y

# No USB device stack anywhere in this build -- this is what keeps the SD card
# from ever being enumerated as a mass-storage device by the host OS.
# (CONFIG_USB_DEVICE_STACK is left unset / default n.)

CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=4096

# Dropped back from DBG to INF: the very high volume of DBG-level per-CMD
# SD/SDHC logging was consistently cutting off mid-capture regardless of
# RTT/log buffer size (tried up to 64KB) -- our own attempt-level summary
# logging in main.c (pass/fail + error code per retry) is lower-volume and
# was reliably captured complete in earlier testing.
CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_SDHC_LOG_LEVEL_INF=y

# Still generous vs. the 1024-byte default, in case that's part of it.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=8192
